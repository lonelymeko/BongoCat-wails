# Wails v3 build config. Only consulted by the `wails3` CLI (`wails3 dev`,
# `wails3 build`, `wails3 package`). The lightweight `task`/`go run` flow in
# Taskfile.yml does NOT need this file.
#
# NOTE: the canonical per-platform build/ scaffolding (build/<os>/Taskfile.yml,
# Info.plist, nsis installer, icons, etc.) is generated by `wails3 init`. See
# MIGRATION-WAILS.md for how to bootstrap it for your exact CLI version.
version: '3'

info:
  companyName: ayangweb
  productName: BongoCat
  productIdentifier: com.ayangweb.BongoCat
  description: 'A cute Live2D desktop pet that reacts to your keyboard, mouse and gamepad.'
  copyright: '(c) 2025, ayangweb'
  comments: Wails v3 port of BongoCat
  version: 1.1.0

dev_mode:
  root_path: .
  log_level: warn
  debounce: 1000
  ignore:
    dir:
      - .git
      - node_modules
      - dist
      - bin
      - src
    file:
      - .DS_Store
      - .gitignore
      - '*_test.go'
    watched_extension:
      - '*.go'
    git_ignore: true
  executes:
    - cmd: wails3 build DEV=true
      type: blocking
    - cmd: pnpm dev
      type: background
    - cmd: wails3 task run
      type: primary

fileAssociations: []
